<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerWing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-brand" id="brand-home" role="button" tabindex="0"
       title="Back to the device overview" aria-label="PowerWing – back to devices">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
    </svg>
    <span class="brand-name">PowerWing</span>
    <span class="brand-version" id="app-version"></span>
  </div>
  <nav id="device-tabs" class="device-tabs"></nav>
  <button id="btn-settings" class="btn-icon" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</header>

<main id="main-content">
  <!-- pages injected by JavaScript -->
  <div id="page-empty" class="page active">
    <div class="empty-state">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M32 8L8 20v24l24 12 24-12V20L32 8z"/>
        <path d="M32 8v36M8 20l24 12 24-12"/>
      </svg>
      <h2>No devices configured</h2>
      <p>Click <strong>⚙</strong> to add your power supplies and USB hub.</p>
    </div>
  </div>

  <!-- Settings page -->
  <div id="page-settings" class="page">
    <div class="settings-card">
      <h2>Settings</h2>

      <section>
        <h3>Devices</h3>
        <div id="settings-device-list"></div>
        <div class="settings-actions">
          <button class="btn-primary" id="btn-add-device">+ Add Device</button>
          <button class="btn-secondary" id="btn-connect-all" title="Open the serial ports of all configured devices">Connect All</button>
        </div>
      </section>

      <section>
        <h3>Add / Edit Device</h3>
        <form id="device-form" class="device-form">
          <label>ID <input type="text" id="df-id" placeholder="e.g. psu1" required></label>
          <label>Name <input type="text" id="df-name" placeholder="e.g. Bench PSU" required></label>
          <label>Type
            <select id="df-type">
              <option value="spm3051">SPM3051 (UART)</option>
              <option value="pd_pocket">PD Pocket (UART)</option>
              <option value="usbslim">USB-Slim Hub (UART)</option>
              <option value="sangenxian">SanGenXian 12-Port Hub (UART)</option>
              <option value="usbalarm">USB Alarm Light (Modbus)</option>
              <option value="f11">F-11 Power Monitor (UART)</option>
              <option value="powerz">POWER-Z Power Meter (USB CDC)</option>
            </select>
          </label>
          <label>Port
            <div class="port-row">
              <input type="text" id="df-port" placeholder="COM3 or /dev/ttyUSB0" required>
              <button type="button" class="btn-secondary" id="btn-scan-ports">Scan</button>
            </div>
          </label>
          <label>Baud rate
            <select id="df-baud">
              <option value="4800">4800</option>
              <option value="9600">9600</option>
              <option value="115200" selected>115200</option>
              <option value="57600">57600</option>
              <option value="38400">38400</option>
              <option value="19200">19200</option>
            </select>
          </label>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Save Device</button>
            <button type="button" class="btn-ghost" id="btn-cancel-form">Cancel</button>
          </div>
        </form>
        <div id="port-suggestions" class="port-suggestions hidden"></div>
      </section>

      <!-- Serial port debug: every open/close performed by this process -->
      <section>
        <h3>Serial Port Debug</h3>
        <div class="serial-log-toolbar">
          <label class="serial-log-auto"><input type="checkbox" id="serial-log-auto" checked> Auto refresh</label>
          <button type="button" class="btn-secondary" id="btn-serial-log-refresh">Refresh</button>
          <button type="button" class="btn-ghost" id="btn-serial-log-clear">Clear</button>
          <span id="serial-log-count" class="serial-log-count"></span>
        </div>
        <div id="serial-log" class="serial-log">
          <div class="serial-log-empty">No serial-port activity recorded yet.</div>
        </div>
      </section>
    </div>
  </div>

  <!-- All-devices grid (always visible when not on settings/empty) -->
  <div id="devices-container" class="devices-container hidden"></div>
</main>

<!-- Templates (hidden) -->
<template id="tpl-psu">
  <div class="page" data-device-type="power_supply">
    <div class="psu-layout">
      <!-- Port configuration – always visible at top -->
      <div class="port-cfg-panel">
        <div class="port-cfg-row">          <span class="device-name-label" title="Click to rename"></span>          <span class="conn-indicator" title="Disconnected"></span>
          <span class="port-cfg-label">PORT</span>
          <select class="port-cfg-select port-sel">
            <option value="">— select —</option>
          </select>
          <span class="port-cfg-label">BPS</span>
          <select class="port-cfg-select baud-sel">
            <option value="9600">9600</option>
            <option value="19200">19200</option>
            <option value="57600">57600</option>
            <option value="115200">115200</option>
          </select>
          <button class="btn-conn">Connect</button>
        </div>
      </div>

      <!-- Device controls (disabled when disconnected) -->
      <div class="device-body">
        <!-- Measurements -->
        <div class="meas-row">
          <div class="meas-card meas-volt">
            <div class="meas-label">VOLTAGE</div>
            <div class="meas-val-row">
              <div class="meas-value volt-value">0.000</div>
              <div class="meas-unit">V</div>
            </div>
            <div class="meas-bar-track"><div class="meas-bar-fill"></div></div>
          </div>
          <div class="meas-card meas-curr">
            <div class="meas-label">CURRENT</div>
            <div class="meas-val-row">
              <div class="meas-value curr-value">0.000</div>
              <div class="meas-unit">A</div>
            </div>
            <div class="meas-bar-track"><div class="meas-bar-fill"></div></div>
          </div>
          <div class="meas-card meas-pow">
            <div class="meas-label">POWER</div>
            <div class="meas-val-row">
              <div class="meas-value pow-value">0.00</div>
              <div class="meas-unit">W</div>
            </div>
            <div class="meas-bar-track"><div class="meas-bar-fill"></div></div>
          </div>
          <div class="status-col">
            <div class="output-sw-wrap">
              <div class="set-label">OUTPUT</div>
              <button class="toggle-sw toggle-sw--lg" role="switch" aria-checked="false" data-cmd="set_outp">
                <span class="toggle-knob"></span>
              </button>
              <div class="output-state">OFF</div>
            </div>
            <div class="mode-badge">CV</div>
            <button class="btn-panel-release hidden" data-cmd="release_control"
                    title="Release front-panel control to the operator; monitoring continues">
              Release panel
            </button>
            <div class="temp-row">
              <span class="temp-label">Temp</span>
              <span class="temp-value">—</span>
            </div>
          </div>
        </div>

        <!-- Set controls -->
        <div class="set-row">
          <div class="set-card">
            <div class="set-label">SET VOLTAGE</div>
            <div class="spinbox-row">
              <div class="spinbox" data-cmd="set_volt" data-min="0" data-max="36" data-step="0.1" data-decimals="2">
                <input class="spin-input" type="number" step="0.1" min="0" max="36" value="0.00">
              </div>
              <span class="bar-val bar-val--volt">0.00</span>
              <span class="spin-unit">V</span>
            </div>
            <div class="bar-wrap">
              <input type="range" class="set-bar" min="0" max="36" step="0.1" value="0">
            </div>
          </div>
          <div class="set-card">
            <div class="set-label">SET CURRENT</div>
            <div class="spinbox-row">
              <div class="spinbox" data-cmd="set_curr" data-min="0" data-max="10" data-step="0.01" data-decimals="2">
                <input class="spin-input" type="number" step="0.01" min="0" max="10" value="0.00">
              </div>
              <span class="bar-val bar-val--curr">0.00</span>
              <span class="spin-unit">A</span>
            </div>
            <div class="bar-wrap">
              <input type="range" class="set-bar" min="0" max="10" step="0.01" value="0">
            </div>
          </div>
        </div>

        <!-- Protection -->
        <details class="protection-section">
          <summary>Protection Limits</summary>
          <div class="set-row">
            <div class="set-card">
              <div class="set-label">OVP LIMIT</div>
              <div class="spinbox-row">
                <div class="spinbox" data-cmd="set_ovp" data-min="0" data-max="40" data-step="0.1" data-decimals="2">
                  <input class="spin-input" type="number" step="0.1" min="0" max="40" value="0.00">
                </div>
                <span class="bar-val bar-val--volt">0.00</span>
                <span class="spin-unit">V</span>
              </div>
              <div class="bar-wrap">
                <input type="range" class="set-bar" min="0" max="40" step="0.1" value="0">
              </div>
            </div>
            <div class="set-card">
              <div class="set-label">OCP LIMIT</div>
              <div class="spinbox-row">
                <div class="spinbox" data-cmd="set_ocp" data-min="0" data-max="10" data-step="0.1" data-decimals="2">
                  <input class="spin-input" type="number" step="0.1" min="0" max="10" value="0.00">
                </div>
                <span class="bar-val bar-val--curr">0.00</span>
                <span class="spin-unit">A</span>
              </div>
              <div class="bar-wrap">
                <input type="range" class="set-bar" min="0" max="10" step="0.1" value="0">
              </div>
            </div>
          </div>
        </details>
      </div>
    </div>
  </div>
</template>

<template id="tpl-hub">
  <div class="page" data-device-type="usb_hub">
    <div class="hub-layout">
      <!-- Port configuration – always visible at top -->
      <div class="port-cfg-panel">
        <div class="port-cfg-row">
          <span class="device-name-label" title="Click to rename"></span>
          <span class="conn-indicator" title="Disconnected"></span>
          <span class="port-cfg-label">PORT</span>
          <select class="port-cfg-select port-sel">
            <option value="">— select —</option>
          </select>
          <span class="port-cfg-label">BPS</span>
          <select class="port-cfg-select baud-sel">
            <option value="9600">9600</option>
            <option value="19200">19200</option>
            <option value="57600">57600</option>
            <option value="115200">115200</option>
            <option value="4800">4800</option>
          </select>
          <button class="btn-conn">Connect</button>
        </div>
      </div>

      <!-- Device controls (disabled when disconnected) -->
      <div class="device-body">
        <div class="hub-all-row">
          <span class="hub-all-label">ALL PORTS</span>
          <button class="btn-all-ports" data-all="on" title="Turn every port ON">All ON</button>
          <button class="btn-all-ports" data-all="off" title="Turn every port OFF">All OFF</button>
        </div>
        <div class="ports-row">
          <!-- Port cards inserted by JS (4 or 12 depending on device) -->
        </div>
        <div class="hub-ctrl-row">
          <button class="btn-hub-ctrl" data-cmd="set_lock" data-param="locked" data-state="false">🔒 Lock OFF</button>
          <button class="btn-hub-ctrl" data-cmd="set_hwkeys" data-param="enabled" data-state="true">⌨ HW Keys ON</button>
          <button class="btn-hub-ctrl" data-cmd="set_autosave" data-param="enabled" data-state="false">💾 Auto-Save OFF</button>
        </div>
      </div>
    </div>
  </div>
</template>

<template id="tpl-alarm">
  <div class="page" data-device-type="alarm_light">
    <div class="hub-layout">
      <!-- Port configuration – always visible at top -->
      <div class="port-cfg-panel">
        <div class="port-cfg-row">
          <span class="device-name-label" title="Click to rename"></span>
          <span class="conn-indicator" title="Disconnected"></span>
          <span class="port-cfg-label">PORT</span>
          <select class="port-cfg-select port-sel">
            <option value="">— select —</option>
          </select>
          <span class="port-cfg-label">BPS</span>
          <select class="port-cfg-select baud-sel">
            <option value="4800" selected>4800</option>
            <option value="9600">9600</option>
            <option value="19200">19200</option>
            <option value="57600">57600</option>
            <option value="115200">115200</option>
          </select>
          <button class="btn-conn">Connect</button>
        </div>
      </div>

      <div class="device-body">
        <!-- Status indicator -->
        <div class="alarm-status-row">
          <div class="alarm-status">
            <span class="alarm-status-label">Status:</span>
            <span class="alarm-status-color" id="alarm-status-text">OFF</span>
          </div>
          <div class="alarm-indicator" id="alarm-indicator"></div>
        </div>

        <!-- Color grid -->
        <div class="alarm-section">
          <div class="set-label">COLOR</div>
          <div class="alarm-color-grid">
            <button class="alarm-color-btn" data-color="red" style="background:#ef4444;">RED</button>
            <button class="alarm-color-btn" data-color="yellow" style="background:#eab308;">YEL</button>
            <button class="alarm-color-btn" data-color="green" style="background:#22c55e;">GRN</button>
            <button class="alarm-color-btn" data-color="white" style="background:#e2e8f0;color:#333;">WHT</button>
            <button class="alarm-color-btn" data-color="cyan" style="background:#06b6d4;">CYN</button>
            <button class="alarm-color-btn" data-color="purple" style="background:#a855f7;">PUR</button>
            <button class="alarm-color-btn" data-color="blue" style="background:#3b82f6;">BLU</button>
          </div>
        </div>

        <!-- Mode selector -->
        <div class="alarm-section">
          <div class="set-label">MODE</div>
          <div class="alarm-mode-row">
            <button class="alarm-mode-btn active" data-mode="on">ON</button>
            <button class="alarm-mode-btn" data-mode="blink_slow">SLOW</button>
            <button class="alarm-mode-btn" data-mode="blink_fast">FAST</button>
          </div>
        </div>

        <!-- Animation crossfade -->
        <div class="alarm-section">
          <div class="set-label">ANIMATION</div>
          <div class="alarm-anim-row">
            <select class="alarm-anim-from" id="alarm-anim-from">
              <option value="red">Red</option>
              <option value="yellow">Yellow</option>
              <option value="green">Green</option>
              <option value="white">White</option>
              <option value="cyan">Cyan</option>
              <option value="purple">Purple</option>
              <option value="blue">Blue</option>
            </select>
            <span class="anim-arrow">→</span>
            <select class="alarm-anim-to" id="alarm-anim-to">
              <option value="red">Red</option>
              <option value="yellow" selected>Yellow</option>
              <option value="green">Green</option>
              <option value="white">White</option>
              <option value="cyan">Cyan</option>
              <option value="purple">Purple</option>
              <option value="blue">Blue</option>
            </select>
            <input class="alarm-anim-dur" id="alarm-anim-dur" type="number" value="2000" min="50" max="30000" step="100">
            <span class="spin-unit">ms</span>
            <input class="alarm-anim-loop" id="alarm-anim-loop" type="number" value="-1" min="-1" max="999" step="1" title="-1=forever, 0/1=single, N=cycles">
            <span class="spin-unit">loop</span>
            <button class="btn-alarm-action" data-cmd="alarm_animate">🎬 Fade</button>
          </div>
        </div>

        <!-- Action buttons -->
        <div class="alarm-section">
          <div class="set-label">ACTIONS</div>
          <div class="alarm-action-row">
            <button class="btn-alarm-action" data-cmd="alarm_buzzer" data-param="on">🔊 Buzzer</button>
            <button class="btn-alarm-action btn-danger" data-cmd="alarm_off">⏻ OFF</button>
            <button class="btn-alarm-action" data-cmd="alarm_rainbow">🌈 Rainbow</button>
          </div>
        </div>

        <!-- Beep row -->
        <div class="alarm-section">
          <div class="set-label">BEEP</div>
          <div class="alarm-beep-row">
            <select class="alarm-beep-color" id="alarm-beep-color">
              <option value="red">Red</option>
              <option value="yellow">Yellow</option>
              <option value="green">Green</option>
              <option value="white">White</option>
              <option value="cyan">Cyan</option>
              <option value="purple">Purple</option>
              <option value="blue">Blue</option>
            </select>
            <input class="alarm-beep-ms" id="alarm-beep-ms" type="number" value="400" min="50" max="10000" step="50">
            <span class="spin-unit">ms</span>
            <button class="btn-alarm-action" data-cmd="alarm_beep">🔔 Beep</button>
          </div>
        </div>

        <!-- PWM section (collapsible) -->
        <details class="protection-section">
          <summary>PWM RGB Control</summary>
          <div class="alarm-pwm-row">
            <div class="set-card">
              <div class="set-label">RED PWM</div>
              <div class="spinbox-row">
                <div class="spinbox" data-cmd="alarm_pwm_r" data-min="0" data-max="1999" data-step="10" data-decimals="0">
                  <input class="spin-input alarm-pwm-inp" type="number" step="10" min="0" max="1999" value="0" data-color="red">
                </div>
                <span class="spin-unit">/1999</span>
              </div>
            </div>
            <div class="set-card">
              <div class="set-label">GREEN PWM</div>
              <div class="spinbox-row">
                <div class="spinbox" data-cmd="alarm_pwm_g" data-min="0" data-max="1999" data-step="10" data-decimals="0">
                  <input class="spin-input alarm-pwm-inp" type="number" step="10" min="0" max="1999" value="0" data-color="green">
                </div>
                <span class="spin-unit">/1999</span>
              </div>
            </div>
            <div class="set-card">
              <div class="set-label">BLUE PWM</div>
              <div class="spinbox-row">
                <div class="spinbox" data-cmd="alarm_pwm_b" data-min="0" data-max="1999" data-step="10" data-decimals="0">
                  <input class="spin-input alarm-pwm-inp" type="number" step="10" min="0" max="1999" value="0" data-color="blue">
                </div>
                <span class="spin-unit">/1999</span>
              </div>
            </div>
          </div>
          <div class="alarm-pwm-extra">
            <label>Flash (×100ms): <input id="alarm-pwm-flash" type="number" value="0" min="0" max="100"></label>
            <label><input id="alarm-pwm-buzzer" type="checkbox"> Buzzer</label>
            <button class="btn-alarm-action" data-cmd="alarm_pwm">Apply PWM</button>
          </div>
        </details>
      </div>
    </div>
  </div>
</template>

<template id="tpl-monitor">
  <div class="page" data-device-type="power_monitor">
    <div class="monitor-layout">
      <!-- Port configuration – always visible at top -->
      <div class="port-cfg-panel">
        <div class="port-cfg-row">
          <span class="device-name-label" title="Click to rename"></span>
          <span class="conn-indicator" title="Disconnected"></span>
          <span class="port-cfg-label">PORT</span>
          <select class="port-cfg-select port-sel">
            <option value="">— select —</option>
          </select>
          <span class="port-cfg-label">BPS</span>
          <select class="port-cfg-select baud-sel">
            <option value="9600">9600</option>
            <option value="19200">19200</option>
            <option value="38400" selected>38400</option>
            <option value="57600">57600</option>
            <option value="115200">115200</option>
          </select>
          <button class="btn-conn">Connect</button>
        </div>
      </div>

      <div class="device-body">
        <!-- Simple mode: live measurements -->
        <div class="meas-row">
          <div class="meas-card meas-volt">
            <div class="meas-label">VOLTAGE</div>
            <div class="meas-val-row">
              <div class="meas-value volt-value">0.000</div>
              <div class="meas-unit">V</div>
            </div>
            <div class="meas-bar-track"><div class="meas-bar-fill"></div></div>
          </div>
          <div class="meas-card meas-curr">
            <div class="meas-label">CURRENT</div>
            <div class="meas-val-row">
              <div class="meas-value curr-value">0.000</div>
              <div class="meas-unit">A</div>
            </div>
            <div class="meas-bar-track"><div class="meas-bar-fill"></div></div>
          </div>
          <div class="meas-card meas-pow">
            <div class="meas-label">POWER</div>
            <div class="meas-val-row">
              <div class="meas-value pow-value">0.000</div>
              <div class="meas-unit">W</div>
            </div>
            <div class="meas-bar-track"><div class="meas-bar-fill"></div></div>
          </div>
          <div class="status-col">
            <div class="monitor-interval-badge">
              <span class="temp-label">Interval</span>
              <span class="interval-value">500ms</span>
            </div>
            <div class="temp-row">
              <span class="temp-label">Samples</span>
              <span class="samples-value">0</span>
            </div>
          </div>
        </div>

        <!-- Expandable measurement panel -->
        <div class="monitor-expand-panel">
          <button class="monitor-expand-btn" aria-expanded="false">
            <span class="expand-arrow">▶</span>
            <span class="expand-label">Measurement</span>
          </button>

          <div class="monitor-expand-body hidden">
            <!-- Average / Peak controls -->
            <div class="monitor-stats-row">
              <div class="monitor-stats-card">
                <div class="set-label">AVERAGE (10ms sampling)</div>
                <div class="monitor-stat-grid">
                  <div class="monitor-stat">
                    <span class="monitor-stat-label">Avg Voltage</span>
                    <span class="monitor-stat-value avg-volt">0.000 <small>V</small></span>
                  </div>
                  <div class="monitor-stat">
                    <span class="monitor-stat-label">Avg Current</span>
                    <span class="monitor-stat-value avg-curr">0.0000 <small>A</small></span>
                  </div>
                </div>
              </div>
              <div class="monitor-stats-card">
                <div class="set-label">PEAK</div>
                <div class="monitor-stat-grid">
                  <div class="monitor-stat">
                    <span class="monitor-stat-label">Peak Voltage</span>
                    <span class="monitor-stat-value peak-volt">0.000 <small>V</small></span>
                  </div>
                  <div class="monitor-stat">
                    <span class="monitor-stat-label">Peak Current</span>
                    <span class="monitor-stat-value peak-curr">0.0000 <small>A</small></span>
                  </div>
                </div>
              </div>
              <div class="monitor-start-card">
                <button class="btn-monitor-start">▶ Start</button>
                <div class="monitor-count">N = <span class="mon-sample-count">0</span></div>
              </div>
            </div>

            <!-- Real-time curve chart -->
            <div class="monitor-chart-card">
              <div class="monitor-chart-header">
                <div class="set-label">REAL-TIME CURVE</div>
                <div class="monitor-chart-controls">
                  <label class="chart-toggle">
                    <input type="checkbox" class="chart-show-volt" checked>
                    <span class="chart-swatch chart-swatch--volt"></span>Voltage
                  </label>
                  <label class="chart-toggle">
                    <input type="checkbox" class="chart-show-curr" checked>
                    <span class="chart-swatch chart-swatch--curr"></span>Current
                  </label>
                </div>
              </div>
              <canvas class="monitor-canvas" height="200"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
